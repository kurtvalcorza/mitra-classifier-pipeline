name: Notebook integration smoke

on:
  pull_request:
    paths:
      - "tutorials/**"
      - "examples/sample-data/**"
      - "scripts/validate_colab_tutorial.py"
      - "scripts/test_pipeline_api_contract.py"
      - "finetuner/pipeline_api.py"
      - "finetuner/train.py"
      - ".github/workflows/notebook-release.yml"
  workflow_dispatch:

# GitHub-hosted notebook execution is integration-regression coverage only.
# It is NOT DIMER Notebook Spec REL1/REL5 clean Google Colab release evidence.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  execute-notebooks:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DIMER_REPO_REF: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"

      - name: Prepare clean GitHub-hosted notebook runtime
        run: |
          sudo mkdir -p /content
          sudo chown -R "$USER":"$USER" /content
          python -m pip install --upgrade pip==26.2.1
          # scikit-learn / pandas / numpy at the isolated lock's versions: the runner-Python steps below import sklearn, and the
          # notebook no longer populates the runner's Python (its install moved into the isolated uv environment).
          python -m pip install psutil==7.1.3 torch==2.9.1 nbconvert==7.17.1 ipykernel==7.3.0 scikit-learn==1.7.2 pandas==2.3.3 numpy==2.3.5

      - name: Validate generated tutorials and auxiliary workshop source
        run: python tools/validate_release_assets.py

      - name: Prepare reduced E2E integration-smoke copy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          source_path = Path("tutorials/mitra_classifier_colab.ipynb")
          smoke_path = Path("/content/mitra_classifier_colab_ci_smoke.ipynb")
          notebook = json.loads(source_path.read_text(encoding="utf-8"))
          # The pretrained fit sits inside `with autogluon_log():` (MCC-m2), so the reduction goes before that block.
          marker = "with autogluon_log():\n    pipe.fit(train_data, target_column=TARGET_COLUMN, eval_metric=EVAL_METRIC, path=PRETRAINED_PATH, fine_tune=False"
          injected = False
          for cell in notebook.get("cells", []):
              if cell.get("cell_type") != "code":
                  continue
              source = cell.get("source", [])
              text = "".join(source) if isinstance(source, list) else str(source)
              if marker not in text:
                  continue
              smoke_setup = (
                  "# GitHub-hosted integration-smoke reduction only; the shipped notebook is unchanged.\n"
                  "train_data, _ = cap_training_rows(train_data, TARGET_COLUMN, seed=SEED, max_rows=24)\n"
                  "holdout_data = holdout_data.groupby(TARGET_COLUMN, group_keys=False).head(3).reset_index(drop=True)\n"
                  "if test_data is not None:\n"
                  "    test_data = test_data.groupby(TARGET_COLUMN, group_keys=False).head(3).reset_index(drop=True)\n"
                  "FEATURE_COLUMNS = [c for c in train_data.columns if c != TARGET_COLUMN]\n"
                  "print(f'CI smoke reduction: train={len(train_data)}, holdout={len(holdout_data)}, test={len(test_data) if test_data is not None else 0}')\n"
              )
              text = text.replace(marker, smoke_setup + marker, 1)
              cell["source"] = text.splitlines(keepends=True)
              injected = True
              break
          if not injected:
              raise RuntimeError("Could not locate the E2E fit marker for integration-smoke reduction.")
          smoke_path.write_text(json.dumps(notebook, indent=1), encoding="utf-8")
          PY

      - name: Execute E2E default pinned-upstream path
        id: e2e
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute /content/mitra_classifier_colab_ci_smoke.ipynb \
            --output executed-mitra-classifier-e2e.ipynb \
            --output-dir /content \
            --ExecutePreprocessor.timeout=900 \
            --ExecutePreprocessor.kernel_name=python3

      - name: Collect E2E and external-artifact outputs
        id: collect
        run: |
          # The E2E notebook's Section 10 (NOTEBOOK_SPEC 3.0 §19.1) scored the pinned release asset on the default path;
          # the separate ARTIFACT-INFERENCE companion run is gone with the companion notebook.
          for root in . /content; do
            if [ -f "$root/outputs/mitra_classifier_predictor.zip" ]; then
              cp "$root/outputs/mitra_classifier_predictor.zip" /content/mitra-predictor.zip
              cp "$root/outputs/mitra_classifier_predictions.csv" /content/predictions.csv
              cp "$root/outputs/external_artifact/mitra_classifier_external_predictions.csv" /content/external-predictions.csv
              cp "$root/outputs/external_artifact/mitra_classifier_external_result.json" /content/external-result.json
              exit 0
            fi
          done
          echo "Error: E2E outputs not found"
          find . /content -name "*predict*" -ls || true
          exit 1

      - name: Assert integration-smoke outputs
        id: assert-outputs
        run: |
          test -f /content/mitra-predictor.zip
          test -f /content/executed-mitra-classifier-e2e.ipynb
          test -f /content/predictions.csv
          test -f /content/external-predictions.csv
          python -c "import json; r = json.load(open('/content/external-result.json')); assert r['artifact']['trusted_digest'].startswith('verified (pinned'), r['artifact']; assert r['input']['kind'] == 'sample' and r['input']['rows'] > 0; print('external-artifact section:', r['artifact']['zip_sha256'], r['input']['rows'], 'rows')"

      - name: Upload notebook integration-smoke artifacts
        id: upload-evidence
        if: ${{ always() && steps.e2e.outcome == 'success' && steps.collect.outcome == 'success' && steps.assert-outputs.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mitra-classifier-notebook-integration-smoke
          path: |
            /content/executed-mitra-classifier-e2e.ipynb
            /content/mitra-predictor.zip
            /content/predictions.csv
            /content/external-predictions.csv
            /content/external-result.json
          if-no-files-found: error
          retention-days: 30

      - name: Record integration-smoke summary
        if: always()
        env:
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          OUTPUT_OUTCOME: ${{ steps.assert-outputs.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload-evidence.outcome }}
        run: |
          if [[ "$E2E_OUTCOME" == "success" && "$COLLECT_OUTCOME" == "success" && "$OUTPUT_OUTCOME" == "success" && "$UPLOAD_OUTCOME" == "success" ]]; then
            SMOKE_STATUS="PASS"
          else
            SMOKE_STATUS="INCOMPLETE/FAIL"
          fi
          {
            echo "## Mitra Classifier notebook integration smoke"
            echo
            echo "- Candidate SHA: \`${DIMER_REPO_REF}\`"
            echo "- Runtime substrate: \`${RUNNER_OS}\` / \`${RUNNER_ARCH}\`, Python \`$(python --version 2>&1)\`"
            echo "- E2E source: pinned immutable upstream checkpoint"
            echo "- GitHub-only workload reduction: 24 training rows, up to 3 holdout/test rows per class"
            echo "- E2E execution: \`${E2E_OUTCOME}\`"
            echo "- Output collection (E2E + Section 10 external artifact): \`${COLLECT_OUTCOME}\`"
            echo "- Required output assertions: \`${OUTPUT_OUTCOME}\`"
            echo "- Integration artifact upload: \`${UPLOAD_OUTCOME}\`"
            echo "- GitHub-hosted integration-smoke status: **${SMOKE_STATUS}**"
            echo "- The shipped notebook is not modified by the workload reduction."
            echo "- The optional DIMER-hosted model.safetensors acquisition branch is not exercised by this GitHub-hosted path."
            echo "- This run is integration-regression coverage only; it is NOT REL1/REL5 clean Google Colab release evidence."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail closed unless integration smoke is complete
        if: always()
        env:
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          OUTPUT_OUTCOME: ${{ steps.assert-outputs.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload-evidence.outcome }}
        run: |
          [[ "$E2E_OUTCOME" == "success" ]]
          [[ "$COLLECT_OUTCOME" == "success" ]]
          [[ "$OUTPUT_OUTCOME" == "success" ]]
          [[ "$UPLOAD_OUTCOME" == "success" ]]
