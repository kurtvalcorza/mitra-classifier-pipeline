name: Relay final semantic remediation

on:
  push:
    branches:
      - fix/notebook-spec-v1-conformance
    paths:
      - ".github/workflows/relay-final-semantic-fix.yml"

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/notebook-spec-v1-conformance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply semantic patch
        run: python .relay/final_semantic_patch.py
      - name: Verify remediation
        run: |
          python -m pip install pandas numpy scikit-learn
          python -m py_compile finetuner/pipeline_api.py finetuner/train.py
          python scripts/check_shared.py
          python scripts/check_contract.py
          python scripts/test_pipeline_api_contract.py
          python scripts/validate_colab_tutorial.py
          python scripts/test_colab_csv_headers.py
          python scripts/test_issue16_hardening.py
          grep -q 'pipeline_materialize_dimer_checkpoint' finetuner/train.py
          if grep -q 'config_source = "platform-provided"' finetuner/train.py; then exit 1; fi
          if grep -q 'DIMER two-file checkpoint' tutorials/README.md; then exit 1; fi
      - name: Publish non-workflow remediation
        run: |
          START_SHA=$(git rev-parse HEAD)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add finetuner/train.py scripts/test_pipeline_api_contract.py tutorials/README.md RELEASE_CHECKLIST.md
          git diff --cached --quiet && { echo 'No permanent changes to publish'; exit 0; }
          git commit -m "fix(finetuner): enforce one-file DIMER checkpoint boundary"
          git fetch origin fix/notebook-spec-v1-conformance
          test "$(git rev-parse origin/fix/notebook-spec-v1-conformance)" = "$START_SHA"
          git push origin HEAD:fix/notebook-spec-v1-conformance
