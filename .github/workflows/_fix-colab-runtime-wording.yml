name: Normalize Colab runtime wording

on:
  push:
    branches:
      - fix/notebook-spec-v1-conformance
    paths:
      - '.github/workflows/_fix-colab-runtime-wording.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/notebook-spec-v1-conformance
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize notebook runtime wording
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths = [
              Path('tutorials/mitra_classifier_colab.ipynb'),
              Path('tutorials/mitra_classifier_predictor_inference_colab.ipynb'),
          ]
          old = 'Use a supported Python 3.12 Colab/Jupyter runtime, restart the session, and run top-to-bottom.'
          new = 'Use a supported Google Colab Python 3.12 runtime, restart the session, and run top-to-bottom.'
          for path in paths:
              nb = json.loads(path.read_text(encoding='utf-8'))
              count = 0
              for cell in nb['cells']:
                  source = cell.get('source', '')
                  if isinstance(source, list):
                      text = ''.join(source)
                      if old in text:
                          count += text.count(old)
                          cell['source'] = text.replace(old, new).splitlines(keepends=True)
                  elif old in source:
                      count += source.count(old)
                      cell['source'] = source.replace(old, new)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one residual Colab/Jupyter message, found {count}')
              path.write_text(json.dumps(nb, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
      - name: Validate
        run: python scripts/validate_colab_tutorial.py
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/_fix-colab-runtime-wording.yml
          git add tutorials/mitra_classifier_colab.ipynb tutorials/mitra_classifier_predictor_inference_colab.ipynb
          git commit -m 'docs(tutorials): remove residual Jupyter support claim'
          git push origin HEAD:fix/notebook-spec-v1-conformance
