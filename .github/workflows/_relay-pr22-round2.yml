name: Relay PR22 Round2 Remediation

on:
  push:
    branches:
      - fix/notebook-spec-v1-conformance

permissions:
  contents: write

jobs:
  remediate:
    if: ${{ !contains(github.event.head_commit.message, '[relay-round2-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/notebook-spec-v1-conformance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply reviewer remediation
        run: python scripts/_relay_fix_pr22_round2.py
      - name: Install lightweight CI deps
        run: pip install pandas numpy
      - name: Run notebook validator
        run: python scripts/validate_colab_tutorial.py
      - name: Run native static/regression checks
        run: |
          python scripts/check_shared_block_parity.py
          python scripts/check_dimer_contract.py
          python scripts/validate_colab_tutorial.py
          python scripts/test_colab_csv_headers.py
          python scripts/test_issue16_hardening.py
          python -m compileall -q .
      - name: Commit remediation and self-cleanup
        run: |
          rm -f scripts/_relay_fix_pr22_round2.py .github/workflows/_relay-pr22-round2.yml
          git config user.name "Kurt Valcorza"
          git config user.email "102845719+kurtvalcorza@users.noreply.github.com"
          git add -A
          git commit -m "fix(tutorials): close second reviewer pass [relay-round2-done]"
          git push origin HEAD:fix/notebook-spec-v1-conformance
