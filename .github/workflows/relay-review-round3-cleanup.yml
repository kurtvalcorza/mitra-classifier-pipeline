name: relay-review-round3-cleanup

on:
  push:
    branches: [fix/notebook-spec-v1-conformance]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/notebook-spec-v1-conformance
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize notebooks and provenance wording
        run: python scripts/relay_review_round3_cleanup.py
      - name: Install lightweight test dependencies
        run: pip install pandas numpy
      - name: Validate retained scope
        run: |
          python scripts/check_shared.py
          python scripts/check_contract.py
          python scripts/validate_colab_tutorial.py
          python scripts/test_colab_csv_headers.py
          python scripts/test_issue16_hardening.py
          python -m py_compile validator/validator.py validator/validate.py validator/contract_hardening.py
          python -m py_compile finetuner/train.py finetuner/contract_entrypoint.py finetuner/contract_hardening.py
          python -m py_compile examples/build_freshretailnet_dataset.py
      - name: Commit cleanup and self-delete tooling
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tutorials/mitra_classifier_colab.ipynb tutorials/mitra_classifier_predictor_inference_colab.ipynb
          git rm -f scripts/relay_review_round3_cleanup.py .github/workflows/relay-review-round3-cleanup.yml
          git commit -m 'chore(tutorials): normalize final reviewer remediation'
          git push origin HEAD:fix/notebook-spec-v1-conformance
