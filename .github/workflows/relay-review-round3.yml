name: relay-review-round3

on:
  push:
    branches: [fix/notebook-spec-v1-conformance]

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/notebook-spec-v1-conformance
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply reviewer fixes
        run: python scripts/relay_review_round3_fix.py
      - name: Install lightweight test dependencies
        run: pip install pandas numpy
      - name: Shared-block parity
        run: python scripts/check_shared.py
      - name: DIMER contract
        run: python scripts/check_contract.py
      - name: Standalone Colab tutorial
        run: python scripts/validate_colab_tutorial.py
      - name: Colab CSV header regressions
        run: python scripts/test_colab_csv_headers.py
      - name: Issue 16 tutorial hardening regressions
        run: python scripts/test_issue16_hardening.py
      - name: Compile deployables
        run: |
          python -m py_compile validator/validator.py validator/validate.py validator/contract_hardening.py
          python -m py_compile finetuner/train.py finetuner/contract_entrypoint.py finetuner/contract_hardening.py
          python -m py_compile examples/build_freshretailnet_dataset.py
      - name: Commit validated remediation and remove relay tooling
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tutorials/mitra_classifier_colab.ipynb tutorials/mitra_classifier_predictor_inference_colab.ipynb scripts/validate_colab_tutorial.py
          git rm -f scripts/relay_review_round3_fix.py .github/workflows/relay-review-round3.yml
          git commit -m 'fix(tutorials): close reviewer schema and archive gaps'
          git push origin HEAD:fix/notebook-spec-v1-conformance
