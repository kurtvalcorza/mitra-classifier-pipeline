name: Fix PR 22 reviewer findings

on:
  push:
    branches:
      - fix/notebook-spec-v1-conformance
    paths:
      - '.github/workflows/_fix-pr22-review.yml'

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/notebook-spec-v1-conformance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply reviewer remediation
        run: python scripts/_fix_pr22_review.py
      - name: Validate tutorial contract
        run: |
          python scripts/validate_colab_tutorial.py
          python scripts/test_colab_csv_headers.py
          python scripts/test_issue16_hardening.py
      - name: Commit remediation and remove temporary scaffolding
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/_fix-pr22-review.yml scripts/_fix_pr22_review.py
          git add -A
          git commit -m 'fix(tutorials): address PR 22 reviewer findings'
          git push origin HEAD:fix/notebook-spec-v1-conformance
