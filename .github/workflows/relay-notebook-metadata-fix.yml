name: relay-notebook-metadata-fix
on:
  push:
    branches: [feat/notebook-spec-1.0]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/notebook-spec-1.0
          fetch-depth: 0
      - name: Add DIMER notebook metadata without regressing current main
        shell: python
        run: |
          import json
          from pathlib import Path
          targets = {
              'tutorials/mitra_classifier_colab.ipynb': {
                  'notebook_profile': 'E2E',
                  'notebook_spec': '1.0',
                  'capability': 'tabular_classification',
              },
              'tutorials/mitra_classifier_predictor_inference_colab.ipynb': {
                  'notebook_profile': 'ARTIFACT-INFERENCE',
                  'notebook_spec': '1.0',
                  'capability': 'tabular_classification_artifact_inference',
              },
          }
          for name, dimer in targets.items():
              p = Path(name)
              nb = json.loads(p.read_text())
              nb.setdefault('metadata', {})['dimer'] = dimer
              p.write_text(json.dumps(nb, ensure_ascii=False, indent=1) + '\n')
      - name: Self-clean and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/relay-notebook-metadata-fix.yml
          git add tutorials/mitra_classifier_colab.ipynb tutorials/mitra_classifier_predictor_inference_colab.ipynb
          git commit -m 'fix: reconcile Notebook Spec metadata onto current main'
          git push origin HEAD:feat/notebook-spec-1.0
