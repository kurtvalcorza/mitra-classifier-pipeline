name: Fix SameFile upload edge case

on:
  push:
    branches:
      - feat/standalone-mitra-colab

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/standalone-mitra-colab
          fetch-depth: 0

      - name: Patch notebook safely
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('tutorials/mitra_classifier_colab.ipynb')
          nb = json.loads(path.read_text(encoding='utf-8'))
          old = """if p.suffix.lower() == '.safetensors':\n        shutil.copy2(p, dest)\n        return"""
          new = """if p.suffix.lower() == '.safetensors':\n        if p.resolve() != dest.resolve():\n            shutil.copy2(p, dest)\n        return"""

          matches = 0
          for cell in nb.get('cells', []):
              if cell.get('cell_type') != 'code':
                  continue
              source = cell.get('source', '')
              if old in source:
                  cell['source'] = source.replace(old, new, 1)
                  matches += 1

          if matches != 1:
              raise SystemExit(f'Expected exactly one direct-upload copy block; found {matches}')

          path.write_text(json.dumps(nb, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Remove temporary workflow and commit patch
        run: |
          rm .github/workflows/fix-samefile-upload.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tutorials/mitra_classifier_colab.ipynb .github/workflows/fix-samefile-upload.yml
          git diff --cached --check
          git commit -m "Fix direct model.safetensors upload"
          git push origin HEAD:feat/standalone-mitra-colab
