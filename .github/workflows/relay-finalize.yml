# Temporary Agent Relay builder finalizer. Self-deletes on success.
name: Relay finalize reviewer remediation

on:
  push:
    branches: [fix/notebook-spec-v1-conformance]
    paths: [.github/workflows/relay-finalize.yml]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/notebook-spec-v1-conformance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore and adapt immutable remediation patcher
        run: |
          git show b69ec2cd1e9316608d2b85bc9739054bd441cfc2:scripts/relay_builder_fix_all.py > /tmp/relay-wrapper.py
          python - <<'PY'
          import ast, base64, zlib
          from pathlib import Path
          wrapper = Path('/tmp/relay-wrapper.py').read_text()
          tree = ast.parse(wrapper)
          payload = next(
              ast.literal_eval(node.value)
              for node in tree.body
              if isinstance(node, ast.Assign)
              and any(isinstance(t, ast.Name) and t.id == '_PAYLOAD' for t in node.targets)
          )
          source = zlib.decompress(base64.b64decode(payload)).decode('utf-8')
          old = 'val = replace_once(val, required_anchor, required_new, "validator shared API markers")'
          new = 'val = val.replace(required_anchor, required_new, 1)'
          if source.count(old) != 1:
              raise RuntimeError(f'expected one historical validator replacement, found {source.count(old)}')
          source = source.replace(old, new, 1)
          Path('/tmp/relay.py').write_text(source, encoding='utf-8')
          PY

      - name: Normalize already-fixed notebook guards to historical before-state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def source(cell):
              value = cell.get('source', [])
              return ''.join(value) if isinstance(value, list) else str(value)

          e2e = Path('tutorials/mitra_classifier_colab.ipynb')
          nb = json.loads(e2e.read_text(encoding='utf-8'))
          for cell in nb['cells']:
              text = source(cell)
              if 'def load_dimer_files(weights_dest, config_dest):' in text:
                  marker = '\n\ndef install_offline_snapshot'
                  if marker not in text:
                      raise RuntimeError('E2E install_offline_snapshot marker missing')
                  text = text.replace(marker, '\n\nMODEL_DIR = MODEL_DIR' + marker, 1)
                  cell['source'] = text.splitlines(keepends=True)
                  break
          else:
              raise RuntimeError('E2E DIMER loader missing')
          e2e.write_text(json.dumps(nb, indent=1, ensure_ascii=False) + '\n', encoding='utf-8')

          companion = Path('tutorials/mitra_classifier_predictor_inference_colab.ipynb')
          nb = json.loads(companion.read_text(encoding='utf-8'))

          for cell in nb['cells']:
              text = source(cell)
              if 'def safe_extract_zip' not in text:
                  continue
              text = text.replace('        seen_members = set()\n', '', 1)
              start = '            normalized_member = portable_member.as_posix()\n'
              end = '            member = Path(*portable_member.parts)\n'
              i = text.find(start)
              j = text.find(end, i if i >= 0 else 0)
              if i >= 0 and j >= 0:
                  text = text[:i] + text[j:]
              cell['source'] = text.splitlines(keepends=True)
              break
          else:
              raise RuntimeError('companion archive guard cell missing')

          current_pre = '''artifact_feature_columns = run_metadata['features']\nif (\n    not isinstance(artifact_feature_columns, list)\n    or not artifact_feature_columns\n    or any(not isinstance(name, str) or not name.strip() for name in artifact_feature_columns)\n    or len(set(artifact_feature_columns)) != len(artifact_feature_columns)\n):\n    raise RuntimeError(\n        'Predictor provenance features must be a non-empty list of unique, non-blank string column names.'\n    )\nprint('✓ Artifact feature schema validated before deserialization.')\n'''
          strict_pre = '''FEATURE_COLUMNS = run_metadata.get('features')\nif (\n    not isinstance(FEATURE_COLUMNS, list)\n    or not FEATURE_COLUMNS\n    or any(not isinstance(name, str) or not name.strip() for name in FEATURE_COLUMNS)\n    or len(set(FEATURE_COLUMNS)) != len(FEATURE_COLUMNS)\n):\n    raise RuntimeError('Predictor provenance features must be a non-empty list of unique, non-empty strings before deserialization.')\nFEATURE_COLUMNS = list(FEATURE_COLUMNS)\n'''
          current_post = '''feature_metadata = getattr(predictor, 'feature_metadata_in', None)\nif feature_metadata is None:\n    raise RuntimeError('Loaded predictor does not expose feature_metadata_in; cannot reconcile artifact feature schema.')\npredictor_feature_columns = list(feature_metadata.get_features())\nif predictor_feature_columns != artifact_feature_columns:\n    raise RuntimeError('Artifact feature schema disagrees with the loaded predictor feature schema.')\nFEATURE_COLUMNS = list(artifact_feature_columns)\nprint('✓ Artifact feature schema reconciled with loaded predictor.')\n'''
          patched_post = '''feature_metadata = getattr(predictor, 'feature_metadata_in', None)\nif feature_metadata is None:\n    raise RuntimeError('Loaded predictor does not expose feature_metadata_in; cannot verify artifact feature schema.')\npredictor_features = list(feature_metadata.get_features())\nif predictor_features != FEATURE_COLUMNS:\n    raise RuntimeError(\n        'Recorded feature schema does not match the deserialized predictor input schema. '\n        f'Recorded={FEATURE_COLUMNS}; predictor={predictor_features}'\n    )\nprint('✓ Recorded feature schema structurally validated before load and matched exactly after deserialization.')\n'''
          old_post = '''if run_metadata.get('features'):\n    FEATURE_COLUMNS = list(run_metadata['features'])\nelse:\n    feature_metadata = getattr(predictor, 'feature_metadata_in', None)\n    if feature_metadata is None:\n        raise RuntimeError('Could not determine required input feature columns from predictor metadata.')\n    FEATURE_COLUMNS = list(feature_metadata.get_features())\n'''

          for cell in nb['cells']:
              text = source(cell)
              if 'required_provenance = [' not in text:
                  continue
              if current_pre in text:
                  text = text.replace(current_pre, '', 1)
              elif strict_pre in text:
                  text = text.replace(strict_pre, '', 1)
              if current_post in text:
                  text = text.replace(current_post, old_post, 1)
              elif patched_post in text:
                  text = text.replace(patched_post, old_post, 1)
              elif old_post not in text:
                  raise RuntimeError('companion schema reconciliation shape is unexpected')
              cell['source'] = text.splitlines(keepends=True)
              break
          else:
              raise RuntimeError('companion provenance cell missing')
          companion.write_text(json.dumps(nb, indent=1, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Complete production shared-API migration
        run: python /tmp/relay.py production

      - name: Install validation dependencies
        run: pip install pandas numpy scikit-learn

      - name: Validate and commit production ancestor
        run: |
          python -m py_compile finetuner/pipeline_api.py finetuner/train.py
          python scripts/check_shared.py
          python scripts/check_contract.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add finetuner/train.py finetuner/Dockerfile finetuner/Dockerfile.gpu .github/workflows/ci.yml
          git commit -m "refactor(finetuner): use shared Mitra pipeline API"
          echo "API_REF=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Complete tutorial remediation against immutable API ancestor
        run: python /tmp/relay.py tutorials --api-ref "$API_REF"

      - name: Remove compatibility sentinel
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('tutorials/mitra_classifier_colab.ipynb')
          nb = json.loads(path.read_text(encoding='utf-8'))
          changed = False
          for cell in nb['cells']:
              value = cell.get('source', [])
              text = ''.join(value) if isinstance(value, list) else str(value)
              if 'MODEL_DIR = MODEL_DIR' in text:
                  text = text.replace('\n\nMODEL_DIR = MODEL_DIR\n\n', '\n\n', 1)
                  cell['source'] = text.splitlines(keepends=True)
                  changed = True
          if not changed:
              raise RuntimeError('temporary E2E compatibility sentinel was not found')
          path.write_text(json.dumps(nb, indent=1, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Run durable repository acceptance checks
        run: |
          python scripts/check_shared.py
          python scripts/check_contract.py
          python scripts/test_pipeline_api_contract.py
          python scripts/validate_colab_tutorial.py
          python scripts/test_colab_csv_headers.py
          python scripts/test_issue16_hardening.py
          python -m py_compile validator/validator.py validator/validate.py validator/contract_hardening.py
          python -m py_compile finetuner/pipeline_api.py finetuner/train.py finetuner/contract_entrypoint.py finetuner/contract_hardening.py
          python -m py_compile examples/build_freshretailnet_dataset.py

      - name: Remove all relay scaffolding, commit final state, and push
        run: |
          git rm -f \
            scripts/relay_builder_fix_all.py \
            scripts/relay_run_patcher.py \
            .github/workflows/relay-builder-reviewer-fix.yml \
            .github/workflows/relay-inspect.yml \
            .github/workflows/relay-finalize.yml
          git add -A
          git commit -m "fix(tutorials): resolve reviewer contract blockers"
          git push origin HEAD:fix/notebook-spec-v1-conformance
