name: Harden notebook spec v1

on:
  push:
    branches:
      - fix/notebook-spec-v1-conformance

permissions:
  contents: write

jobs:
  harden:
    if: ${{ !contains(github.event.head_commit.message, '[notebook-spec-final]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/notebook-spec-v1-conformance
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validator dependencies
        run: python -m pip install --upgrade pip pandas numpy

      - name: Apply final hardening
        run: python scripts/_harden_notebook_spec_v1_v2.py

      - name: Run tutorial validators
        run: |
          python scripts/validate_colab_tutorial.py
          python scripts/test_colab_csv_headers.py
          python scripts/test_issue16_hardening.py

      - name: Commit hardened notebooks and remove temporary scaffolding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/_harden_notebook_spec_v1.py scripts/_harden_notebook_spec_v1_v2.py .github/workflows/_harden-notebook-spec-v1.yml
          git add tutorials/ scripts/validate_colab_tutorial.py
          git commit -m "fix(tutorials): harden Notebook Spec v1 artifact and runtime contracts [notebook-spec-final]"
          git push origin HEAD:fix/notebook-spec-v1-conformance
