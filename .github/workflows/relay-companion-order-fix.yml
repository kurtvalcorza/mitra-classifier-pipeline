name: Relay companion initialization fix

on:
  push:
    branches:
      - fix/notebook-spec-v1-conformance
    paths:
      - ".github/workflows/relay-companion-order-fix.yml"

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/notebook-spec-v1-conformance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fix companion initialization order
        run: python scripts/relay_fix_companion_order.py
      - name: Verify static notebook contract
        run: |
          python scripts/validate_colab_tutorial.py
          python scripts/test_colab_csv_headers.py
          python -m py_compile finetuner/pipeline_api.py finetuner/train.py
      - name: Publish fix
        run: |
          START_SHA=$(git rev-parse HEAD)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tutorials/mitra_classifier_predictor_inference_colab.ipynb
          git rm scripts/relay_fix_companion_order.py
          git commit -m "fix(tutorials): initialize companion model constants before API check"
          git fetch origin fix/notebook-spec-v1-conformance
          test "$(git rev-parse origin/fix/notebook-spec-v1-conformance)" = "$START_SHA"
          git push origin HEAD:fix/notebook-spec-v1-conformance
