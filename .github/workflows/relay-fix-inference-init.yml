name: Relay inference initialization remediation

on:
  push:
    branches:
      - fix/notebook-spec-v1-conformance
    paths:
      - ".github/workflows/relay-fix-inference-init.yml"

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/notebook-spec-v1-conformance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply notebook initialization fix
        run: python .relay/fix_inference_init.py
      - name: Verify static contracts
        run: |
          python -m pip install pandas numpy scikit-learn
          python scripts/test_pipeline_api_contract.py
          python scripts/validate_colab_tutorial.py
          python scripts/test_colab_csv_headers.py
          python scripts/test_issue16_hardening.py
      - name: Publish permanent remediation
        run: |
          START_SHA=$(git rev-parse HEAD)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tutorials/mitra_classifier_predictor_inference_colab.ipynb scripts/validate_colab_tutorial.py
          git diff --cached --quiet && { echo 'No permanent changes to publish'; exit 0; }
          git commit -m "fix(tutorials): initialize inference model contract before API check"
          git fetch origin fix/notebook-spec-v1-conformance
          test "$(git rev-parse origin/fix/notebook-spec-v1-conformance)" = "$START_SHA"
          git push origin HEAD:fix/notebook-spec-v1-conformance
