name: Remediate reviewer round 2

on:
  push:
    branches:
      - fix/notebook-spec-v1-conformance
    paths:
      - '.github/scripts/remediate_review_round2.py'
      - '.github/workflows/remediate-review-round2.yml'

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/notebook-spec-v1-conformance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply remediation
        run: python .github/scripts/remediate_review_round2.py
      - name: Run notebook/static checks
        run: |
          pip install pandas numpy
          python scripts/check_shared.py
          python scripts/check_contract.py
          python scripts/validate_colab_tutorial.py
          python scripts/test_colab_csv_headers.py
          python scripts/test_issue16_hardening.py
          python -m compileall -q validator finetuner
      - name: Commit remediation and remove temporary tooling
        run: |
          git config user.name 'Kurt Valcorza'
          git config user.email '102845719+kurtvalcorza@users.noreply.github.com'
          git rm -f .github/scripts/remediate_review_round2.py .github/workflows/remediate-review-round2.yml
          git add DEPLOYMENT.md scripts/validate_colab_tutorial.py tutorials/README.md tutorials/mitra_classifier_colab.ipynb tutorials/mitra_classifier_predictor_inference_colab.ipynb
          git commit -m 'fix(tutorials): close reviewer round-2 findings'
          git push origin HEAD:fix/notebook-spec-v1-conformance
