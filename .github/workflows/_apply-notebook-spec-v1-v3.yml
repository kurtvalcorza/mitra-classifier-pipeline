name: Apply notebook spec v1 migration v3

on:
  push:
    branches:
      - fix/notebook-spec-v1-conformance

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/notebook-spec-v1-conformance
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install migration tooling
        run: python -m pip install --upgrade pip pip-tools pandas numpy

      - name: Apply notebook migration
        run: python scripts/_apply_notebook_spec_v1_v3.py

      - name: Run tutorial validators
        run: |
          python scripts/validate_colab_tutorial.py
          python scripts/test_colab_csv_headers.py
          python scripts/test_issue16_hardening.py

      - name: Commit migrated notebooks and remove temporary scaffolding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/_apply_notebook_spec_v1.py scripts/_apply_notebook_spec_v1_v2.py scripts/_apply_notebook_spec_v1_v3.py .github/workflows/_apply-notebook-spec-v1.yml .github/workflows/_apply-notebook-spec-v1-v2.yml .github/workflows/_apply-notebook-spec-v1-v3.yml
          git add tutorials/ RELEASE_CHECKLIST.md scripts/validate_colab_tutorial.py
          git commit -m "fix(tutorials): align notebooks with DIMER Notebook Spec v1.0 [notebook-spec-migrated]"
          git push origin HEAD:fix/notebook-spec-v1-conformance
