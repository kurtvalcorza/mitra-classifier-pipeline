name: PR22 round-3 remediation

on:
  push:
    branches: [fix/notebook-spec-v1-conformance]

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assemble and apply remediation
        run: |
          sed -i "s/new_func = '''def load_dimer_package/new_func = r'''def load_dimer_package/" scripts/_pr22_r3_part00.pyfrag
          sed -i "s/PACKAGE_SCRIPT.write_text('''#!/PACKAGE_SCRIPT.write_text(r'''#!/" scripts/_pr22_r3_part02.pyfrag
          sed -i "s/PACKAGE_DOC.write_text('''# DIMER/PACKAGE_DOC.write_text(r'''# DIMER/" scripts/_pr22_r3_part04.pyfrag
          sed -i 's/repository-defined notebook transport envelope/Repository-defined notebook transport envelope/' scripts/_pr22_r3_part05.pyfrag
          cat scripts/_pr22_r3_part00.pyfrag \
              scripts/_pr22_r3_part01.pyfrag \
              scripts/_pr22_r3_part02.pyfrag \
              scripts/_pr22_r3_part03.pyfrag \
              scripts/_pr22_r3_part04.pyfrag \
              scripts/_pr22_r3_part05.pyfrag > scripts/_pr22_round3.py
          python -m py_compile scripts/_pr22_round3.py
          python scripts/_pr22_round3.py
      - name: Static and regression gates
        run: |
          pip install pandas numpy
          python scripts/validate_colab_tutorial.py
          python scripts/build_dimer_notebook_package.py --self-test
          python scripts/check_shared.py
          python scripts/check_contract.py
          python scripts/test_colab_csv_headers.py
          python scripts/test_issue16_hardening.py
          python -m py_compile scripts/build_dimer_notebook_package.py
          python -m py_compile validator/validator.py validator/validate.py validator/contract_hardening.py
          python -m py_compile finetuner/train.py finetuner/contract_entrypoint.py finetuner/contract_hardening.py
      - name: Commit remediation and remove scaffolding
        run: |
          rm -f scripts/_pr22_r3_part*.pyfrag scripts/_pr22_round3.py .github/workflows/pr22-round3-remediate.yml
          git config user.name "Kurt Valcorza"
          git config user.email "102845719+kurtvalcorza@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "fix(tutorials): close reviewer contract findings"
          git push
