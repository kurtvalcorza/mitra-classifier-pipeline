name: Finalize reviewer round 2 docs

on:
  push:
    branches:
      - fix/notebook-spec-v1-conformance
    paths:
      - '.github/scripts/finalize_round2_docs.py'
      - '.github/workflows/finalize-round2-docs.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/notebook-spec-v1-conformance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/scripts/finalize_round2_docs.py
      - run: |
          pip install pandas numpy
          python scripts/check_shared.py
          python scripts/check_contract.py
          python scripts/validate_colab_tutorial.py
          python scripts/test_colab_csv_headers.py
          python scripts/test_issue16_hardening.py
      - name: Commit and self-delete
        run: |
          git config user.name 'Kurt Valcorza'
          git config user.email '102845719+kurtvalcorza@users.noreply.github.com'
          git rm -f .github/scripts/finalize_round2_docs.py .github/workflows/finalize-round2-docs.yml
          git add DEPLOYMENT.md scripts/validate_colab_tutorial.py
          git commit -m 'docs: reconcile CI evidence claims'
          git push origin HEAD:fix/notebook-spec-v1-conformance
